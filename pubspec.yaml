name: timed_memo
description: Private, offline voice reminders for Android.
publish_to: none
version: 0.9.14+25
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sherpa_onnx: 1.13.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/vad/
    - assets/tts/
    - native/app/src/main/assets/voice_catalog.json
  # One face, subset to GB2312 + ASCII (2.3MB). Used only for titles at 19px
  # and above — see MemoType.display for why it stops there.
  fonts:
    - family: MemoSerif
      fonts:
        - asset: assets/fonts/MemoSerif-Regular.otf
