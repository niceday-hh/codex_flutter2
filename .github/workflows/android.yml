name: Android build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signing: ${{ steps.sign.outputs.signing }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Bootstrap Android platform
        run: bash tool/bootstrap.sh
      - name: Analyze Flutter code
        run: flutter analyze
      - name: Flutter UI and voice parser tests
        run: flutter test
      - name: Native schedule checks
        run: |
          mkdir -p tool/out
          javac -d tool/out native/app/src/main/java/com/niceday/memo/Schedule.java tool/ScheduleTest.java
          java -cp tool/out ScheduleTest
      - uses: actions/cache@v4
        with:
          path: model-downloads
          key: paraformer-zh-int8-a071ee5419e14adb
      - name: Prepare embedded offline model
        run: python3 tool/fetch_model.py
      - name: Prepare fixed release signing
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tool/prepare_signing.py
      - name: Build arm64 APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Native notification, boot, state and backup tests
        run: cd android && ./gradlew :app:testReleaseUnitTest --no-daemon
      - name: Verify embedded model and fixed certificate
        run: python3 tool/verify_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-build
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/BUILD_INFO.json
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: build/app/test-results/testReleaseUnitTest/*.xml
          if-no-files-found: ignore
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Build CI-only debug probe APK
        run: |
          bash tool/bootstrap.sh
          flutter build apk --debug --target-platform android-x64
      - name: Free space for Android system image
        run: |
          (cd android && ./gradlew --stop)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/system-images /opt/hostedtoolcache/CodeQL
          rm -rf "$PUB_CACHE" "$HOME/.gradle/caches"
          df -h /
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Real Android process-death, Doze and reboot checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 2048
          script: python3 tool/device_alarm_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: device-test-results.json
  publish:
    needs: [build, emulator]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.signing == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arm64-build
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: device-test-results
          path: release
      - name: Publish verified signed APK and version notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$(cat .release-version)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release exists; bump version before publishing a new build."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "定时备忘录 $tag · 固定签名新版" \
            --notes-file "docs/releases/$tag.md" --prerelease release/*.apk release/*.json release/SHA256SUMS.txt
