name: Android build and release
on:
  push:
    branches: [main, vits-archive]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release-v090-${{ github.ref }}
  cancel-in-progress: true
env:
  CI_ASSET_TAG: ci-${{ github.run_id }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Prepare Flutter and pinned VAD
        run: bash tool/bootstrap.sh
      - name: Prepare real VAD test runtime
        run: python3 tool/fetch_test_runtime.py
      - name: Analyze Flutter code
        run: flutter analyze
      - name: Flutter voice flow, UI, parser and real VAD tests
        env:
          LD_LIBRARY_PATH: ${{ env.SHERPA_TEST_LIB }}
        run: flutter test --timeout=45s --fail-fast
      - name: Native schedule checks
        run: |
          mkdir -p tool/out
          javac -d tool/out native/app/src/main/java/com/niceday/memo/Schedule.java tool/ScheduleTest.java
          java -cp tool/out ScheduleTest
      - name: Debug fixture snapshot race checks
        run: python3 -m unittest discover -s tool -p '*_unit_test.py' -v
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare private draft asset transfer
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$CI_ASSET_TAG" >/dev/null 2>&1; then
            gh release create "$CI_ASSET_TAG" --target "$GITHUB_SHA" --draft \
              --title "CI ${{ github.run_id }} (unpublished)" \
              --notes "Temporary build transfer; publication still requires all checks and fixed signing."
          fi
  build:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signing: ${{ steps.sign.outputs.signing }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: model-downloads
          key: offline-models-${{ github.job }}-${{ hashFiles('tool/fetch_model.py', 'tool/fetch_vad.py', 'tool/fetch_mnn.py', 'tool/vits_model.lock.json') }}
      - name: Bootstrap Android platform
        run: bash tool/bootstrap.sh
      - name: Prepare embedded offline model
        run: |
          python3 tool/fetch_model.py
          python3 tool/fetch_vad.py
      - name: Prepare VITS-MNN offline speech model
        run: python3 tool/fetch_tts.py
      - name: Prepare fixed release signing
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tool/prepare_signing.py
      - name: Native notification, speech, state and backup tests
        run: cd android && ./gradlew :app:testReleaseUnitTest --no-daemon -Ptarget-platform=android-arm64
      - uses: actions/cache/restore@v4
        id: nativecache
        with:
          path: build/.cxx
          key: mnn-cxx-v2-arm64-release-${{ hashFiles('native/app/src/main/cpp/**', 'native/app/build.gradle.kts', 'tool/fetch_mnn.py') }}
      - name: Build arm64 APK
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/cache/save@v4
        if: steps.nativecache.outputs.cache-hit != 'true'
        with:
          path: build/.cxx
          key: ${{ steps.nativecache.outputs.cache-primary-key }}
      - name: Verify embedded model and fixed certificate
        run: python3 tool/verify_apk.py
      - name: Stage verified signed build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$CI_ASSET_TAG" --clobber \
            build/app/outputs/flutter-apk/*.apk \
            build/app/outputs/flutter-apk/BUILD_INFO.json \
            build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: Stage native test reports
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import glob, zipfile
          paths = glob.glob("build/app/test-results/testReleaseUnitTest/*.xml")
          if paths:
              with zipfile.ZipFile("native-test-results.zip", "w", zipfile.ZIP_DEFLATED) as out:
                  for path in paths:
                      out.write(path, path.rsplit("/", 1)[-1])
          PY
          if [ -f native-test-results.zip ]; then
            gh release upload "$CI_ASSET_TAG" native-test-results.zip --clobber
          fi
  emulator:
    needs: [prepare, checks]
    strategy:
      fail-fast: false
      matrix:
        api: [33, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: model-downloads
          key: offline-models-${{ github.job }}-${{ hashFiles('tool/fetch_model.py', 'tool/fetch_vad.py', 'tool/fetch_mnn.py', 'tool/vits_model.lock.json') }}
      - uses: actions/cache/restore@v4
        id: nativecache
        with:
          path: build/.cxx
          key: mnn-cxx-v2-x64-api${{ matrix.api }}-${{ hashFiles('native/app/src/main/cpp/**', 'native/app/build.gradle.kts', 'tool/fetch_mnn.py') }}
      - name: Build CI-only debug probe APK
        run: |
          bash tool/bootstrap.sh
          python3 tool/fetch_tts.py
          flutter build apk --debug --target-platform android-x64
      - uses: actions/cache/save@v4
        if: steps.nativecache.outputs.cache-hit != 'true'
        with:
          path: build/.cxx
          key: ${{ steps.nativecache.outputs.cache-primary-key }}
      - name: Free space for Android system image
        run: |
          (cd android && ./gradlew --stop)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/system-images /opt/hostedtoolcache/CodeQL
          rm -rf "$PUB_CACHE" "$HOME/.gradle/caches"
          df -h /
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android process-death, Doze, privacy and speech checks (no reboot)
        env:
          MEMO_RUN_REBOOT_TESTS: "0"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 2048
          script: |
            python3 tool/device_test_suite.py
      - name: Stage device test reports
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          reports=(device-*-test-results-api*.json)
          if [ "${#reports[@]}" -gt 0 ]; then
            gh release upload "$CI_ASSET_TAG" "${reports[@]}" --clobber
          fi
  publish:
    needs: [build, emulator]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.signing == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified signed APK and version notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$(cat .release-version)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release exists; bump version before publishing a new build."
            exit 0
          fi
          gh release download "$CI_ASSET_TAG" --dir release
          (cd release && sha256sum --check SHA256SUMS.txt)
          gh release create "$tag" --target "$GITHUB_SHA" --title "超级提醒 $tag · 固定签名新版" \
            --notes-file "docs/releases/$tag.md" --prerelease \
            release/*.apk release/*.json release/SHA256SUMS.txt release/native-test-results.zip
          gh release delete "$CI_ASSET_TAG" --yes
