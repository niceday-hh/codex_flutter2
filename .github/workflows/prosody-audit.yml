name: VITS real model prosody comparison
on:
  push:
    branches: [feature/v0.9.5-fixes, feature/v0.9.7-web-baseline]
    # UI-only revisions do not change synthesis and can reuse the native audio comparison.
    paths:
      - 'native/app/src/main/cpp/**'
      - 'native/app/src/main/java/com/niceday/memo/Vits*.java'
      - 'native/app/src/main/java/com/niceday/memo/tts/**'
      - 'native/app/src/main/java/com/niceday/memo/TtsAssets.java'
      - 'native/app/src/debug/java/com/niceday/memo/DebugProsodyActivity.java'
      - 'native/app/build.gradle.kts'
      - 'tool/device_prosody_test.py'
      - 'tool/fetch_tts.py'
      - 'tool/vits_model.lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prosody-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: model-downloads
          key: offline-models-emulator-${{ hashFiles('tool/fetch_model.py', 'tool/fetch_vad.py', 'tool/fetch_mnn.py', 'tool/vits_model.lock.json') }}
      - uses: actions/cache/restore@v4
        id: nativecache
        with:
          path: build/.cxx
          key: mnn-cxx-v2-x64-api35-${{ hashFiles('native/app/src/main/cpp/**', 'native/app/build.gradle.kts', 'tool/fetch_mnn.py') }}
      - name: Build debug-only synthesis audit
        run: |
          bash tool/bootstrap.sh
          python3 tool/fetch_tts.py
          flutter build apk --debug --target-platform android-x64
      - uses: actions/cache/save@v4
        if: steps.nativecache.outputs.cache-hit != 'true'
        with:
          path: build/.cxx
          key: ${{ steps.nativecache.outputs.cache-primary-key }}
      - name: Free emulator disk space
        run: |
          (cd android && ./gradlew --stop)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/system-images /opt/hostedtoolcache/CodeQL
          rm -rf "$PUB_CACHE" "$HOME/.gradle/caches"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Compare staged synthesis and slower rates
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -partition-size 2048
          script: python3 tool/device_prosody_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prosody-wav-comparison
          path: prosody-audit/
          if-no-files-found: ignore
          retention-days: 7
