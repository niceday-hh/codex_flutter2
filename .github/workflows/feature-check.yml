name: Feature checks and UI previews
on:
  push:
    branches: [feature/v0.9.2-ui, feature/v0.9.3-settings, feature/v0.9.4-prosody, feature/v0.9.5-fixes, feature/v0.9.5-reminder-audio, feature/v0.9.6-voice-controls]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feature-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Prepare project and VAD runtime
        run: |
          bash tool/bootstrap.sh
          python3 tool/fetch_test_runtime.py
      - name: Analyze
        run: flutter analyze
      - name: Native punctuation duration policy
        run: g++ -std=c++17 -Wall -Wextra -Werror tool/VitsProsodyTest.cpp -o /tmp/vits-prosody-test && /tmp/vits-prosody-test
      - name: Flutter regression tests
        env:
          LD_LIBRARY_PATH: ${{ env.SHERPA_TEST_LIB }}
        run: flutter test --timeout=45s
      - name: Prepare Chinese preview font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          echo "MEMO_PREVIEW_FONT=$(fc-match -f '%{file}' 'Noto Sans CJK SC')" >> "$GITHUB_ENV"
      - name: Capture actual UI previews
        env:
          MEMO_UI_PREVIEWS: '1'
          LD_LIBRARY_PATH: ${{ env.SHERPA_TEST_LIB }}
        run: flutter test test/ui_preview_test.dart --timeout=90s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-previews
          path: ui-previews/*.png
          if-no-files-found: ignore
          retention-days: 7
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Bootstrap Android platform
        run: bash tool/bootstrap.sh
      - name: Native settings and reminder regression tests
        run: cd android && ./gradlew :app:testReleaseUnitTest --no-daemon -Ptarget-platform=android-arm64
      - name: Compile Android MNN inference adapter
        run: cd android && ./gradlew :app:externalNativeBuildDebug :app:compileDebugJavaWithJavac --no-daemon -Ptarget-platform=android-arm64
