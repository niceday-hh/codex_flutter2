name: Gemini 1.0 Regression CI & Pre-release
on:
  push:
    branches: [gemini]
    tags: ['v1.0.*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gemini-prerelease-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Prepare project and VAD runtime
        run: |
          bash tool/bootstrap.sh
          python3 tool/fetch_test_runtime.py
      - name: Flutter analyze
        run: flutter analyze
      - name: Native schedule unit test
        run: |
          javac -d /tmp/schedule-test native/app/src/main/java/com/niceday/memo/Schedule.java tool/ScheduleTest.java
          java -cp /tmp/schedule-test ScheduleTest
      - name: Native punctuation duration policy
        run: g++ -std=c++17 -Wall -Wextra -Werror tool/VitsProsodyTest.cpp -o /tmp/vits-prosody-test && /tmp/vits-prosody-test
      - name: Flutter full regression tests
        env:
          LD_LIBRARY_PATH: ${{ env.SHERPA_TEST_LIB }}
        run: flutter test --timeout=45s --fail-fast

  build-and-prerelease:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Bootstrap Android platform and offline models
        run: |
          bash tool/bootstrap.sh
          python3 tool/fetch_model.py
          python3 tool/fetch_vad.py
          python3 tool/fetch_tts.py
      - name: Prepare fixed release signing
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tool/prepare_signing.py
      - uses: actions/cache/restore@v4
        id: nativecache
        with:
          path: build/.cxx
          key: mnn-cxx-v2-arm64-release-${{ hashFiles('native/app/src/main/cpp/**', 'native/app/build.gradle.kts', 'tool/fetch_mnn.py') }}
      - name: Build arm64 release APK and run native Robolectric regression tests
        run: |
          flutter build apk --release --target-platform android-arm64
          cd android && ./gradlew :app:testReleaseUnitTest --no-daemon -Ptarget-platform=android-arm64
      - uses: actions/cache/save@v4
        if: steps.nativecache.outputs.cache-hit != 'true'
        with:
          path: build/.cxx
          key: ${{ steps.nativecache.outputs.cache-primary-key }}
      - name: Verify embedded model and fixed certificate
        run: python3 tool/verify_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: codex-flutter2-gemini-arm64-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 7
      - name: Update v1.0.0-gemini.1 Pre-release with verified signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.0-gemini.1 build/app/outputs/flutter-apk/*.apk build/app/outputs/flutter-apk/SHA256SUMS.txt --clobber
